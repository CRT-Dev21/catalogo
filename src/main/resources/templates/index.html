<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de películas</title>
    <style>
        :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; color: #202923; background: #f2f2e9; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        header { padding: 36px max(24px, calc((100% - 1100px) / 2)); background: #183b35; color: #f4f0df; }
        header p { margin: 8px 0 0; color: #c7d5c7; font: 15px/1.5 Arial, sans-serif; }
        h1 { margin: 0; font-size: 32px; font-weight: 500; }
        main { max-width: 1100px; margin: 0 auto; padding: 30px 24px 56px; }
        .count { margin: 0 0 14px; color: #52645a; font: 14px Arial, sans-serif; }
        .table-wrap { overflow-x: auto; background: #fffefa; border: 1px solid #d7ddd2; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 16px; border-bottom: 1px solid #e3e6de; vertical-align: top; }
        th { background: #e6ebe1; color: #31483b; font: 12px Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
        td { font: 15px/1.5 Arial, sans-serif; }
        tr:last-child td { border-bottom: 0; }
        .title { min-width: 150px; font-family: Georgia, "Times New Roman", serif; font-size: 17px; }
        .synopsis { min-width: 280px; max-width: 520px; }
        .cover { color: #28624f; overflow-wrap: anywhere; }
        @media (max-width: 640px) { header { padding-top: 28px; padding-bottom: 28px; } main { padding: 20px 12px 40px; } th, td { padding: 12px; } }
    </style>
</head>
<body>
<header>
    <h1 th:text="${tituloPrincipal}">Catálogo de películas</h1>
    <p>Registro de películas almacenado con Spring Data JPA y H2.</p>
</header>
<main>
    <p class="count"><span th:text="${#lists.size(peliculas)}">0</span> películas de ejemplo</p>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Título</th>
                <th>Sinopsis</th>
                <th>Año</th>
                <th>Portada</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pelicula : ${peliculas}">
                <td class="title" th:text="${pelicula.title}">Título</td>
                <td class="synopsis" th:text="${pelicula.synopsis}">Sinopsis</td>
                <td th:text="${pelicula.year}">2000</td>
                <td><a class="cover" th:href="${pelicula.cover}" th:text="${pelicula.cover}" target="_blank" rel="noopener">Portada</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
